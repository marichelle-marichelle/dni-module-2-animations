<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privilege | See it in motion</title>
<style>

:root { color-scheme:light; --navy:#002C4E; --focus:#0868BC; --border:#D9E8EE; }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;background:transparent;font-family:"Public Sans",Arial,Helvetica,sans-serif;color:#002C4E;-webkit-font-smoothing:antialiased}
.motion{width:min(100%,720px);margin:0 auto;padding:2px}
.stage{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:linear-gradient(125deg,#EFF8FD 0%,#F5FAFC 64%,#F3F9EC 100%)}
.visual{position:relative;width:100%;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
.visual svg{display:block;width:100%;max-width:760px;height:auto;overflow:visible}
.action-area{display:flex;align-items:center;justify-content:center;padding:14px 16px 16px;background:#FFFFFF;border-top:1px solid var(--border)}
.action{display:inline-flex;justify-content:center;align-items:center;min-height:48px;min-width:190px;border:2px solid var(--navy);border-radius:10px;background:var(--navy);color:#fff;padding:11px 20px;font:700 16px/1.25 "Public Sans",Arial,sans-serif;cursor:pointer;transition:background-color .15s ease}
.action:hover{background:#08476C}
.action:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.action:active{transform:translateY(1px)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* The illustration stays at its initial state until the learner presses the button. */
.visual:not(.playing) .power-line path {stroke-dasharray:1;stroke-dashoffset:1}
.visual:not(.playing) .power-node.delay-1,
.visual:not(.playing) .power-node.delay-2,
.visual:not(.playing) .power-node.delay-3 {opacity:0;transform:scale(.7)}
.visual:not(.playing) .path-barrier{opacity:0;transform:translateY(21px)}
.visual:not(.playing) .path-compare{opacity:0}
.visual:not(.playing) .lens-a{opacity:.6;transform:translate(-70px,-20px)}
.visual:not(.playing) .lens-b{opacity:.6;transform:translate(70px,-20px)}
.visual:not(.playing) .lens-c{opacity:.6;transform:translate(0,22px)}
.visual:not(.playing) .intersection-core,
.visual:not(.playing) .core-halo{opacity:0;transform:scale(.5)}
/* Play on demand. Fill modes hold final state until replay is requested. */
.visual.playing .power-line path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.05s ease-out .12s both}
.visual.playing .power-node{animation:node-in .55s cubic-bezier(.16,1,.3,1) both}
.visual.playing .power-node.delay-1{animation-delay:.47s}
.visual.playing .power-node.delay-2{animation-delay:.66s}
.visual.playing .power-node.delay-3{animation-delay:.85s}
.visual.playing .path-barrier{animation:rise-in .52s ease-out both}
.visual.playing .path-barrier.b1{animation-delay:.24s}
.visual.playing .path-barrier.b2{animation-delay:.48s}
.visual.playing .path-barrier.b3{animation-delay:.72s}
.visual.playing .path-compare{animation:focus-in .65s ease-out 1.25s both}
.visual.playing .traveller{animation:node-in .6s ease-out .22s both}
.visual.playing .lens-a{animation:merge-a 1.55s cubic-bezier(.19,1,.22,1) .12s both}
.visual.playing .lens-b{animation:merge-b 1.55s cubic-bezier(.19,1,.22,1) .2s both}
.visual.playing .lens-c{animation:merge-c 1.55s cubic-bezier(.19,1,.22,1) .28s both}
.visual.playing .intersection-core{animation:core-appear .75s ease-out 1.25s both}
.visual.playing .core-halo{animation:focus-in .7s ease-out 1.45s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes node-in{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes rise-in{from{opacity:0;transform:translateY(21px)}to{opacity:1;transform:translateY(0)}}
@keyframes merge-a{from{opacity:.6;transform:translate(-70px,-20px)}to{opacity:1;transform:translate(0,0)}}
@keyframes merge-b{from{opacity:.6;transform:translate(70px,-20px)}to{opacity:1;transform:translate(0,0)}}
@keyframes merge-c{from{opacity:.6;transform:translate(0,22px)}to{opacity:1;transform:translate(0,0)}}
@keyframes core-appear{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes focus-in{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@media(max-width:520px){
  .stage{border-radius:12px}
  .visual{padding:8px 7px}
  .action-area{padding:11px 10px}
  .action{width:100%;max-width:265px;min-width:0;font-size:15px}
}
/* Reduced motion users see the final composition immediately after activation. */
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important}
 .visual.playing .power-line path{stroke-dashoffset:0!important}
 .visual.playing .power-node,
 .visual.playing .path-barrier,
 .visual.playing .path-compare,
 .visual.playing .lens-a,
 .visual.playing .lens-b,
 .visual.playing .lens-c,
 .visual.playing .intersection-core,
 .visual.playing .core-halo{opacity:1!important;transform:none!important}
}

</style>
</head>
<body>
<main class="motion" aria-label="Privilege animation">
  <div class="stage">
    <div id="motion-visual" class="visual" role="img" aria-label="Two parallel paths lead toward a goal. Both have barriers, but one path has fewer barriers than the other.">
      <svg aria-hidden="true" focusable="false" viewbox="0 0 600 330" xmlns="http://www.w3.org/2000/svg">
<rect fill="#F3F9FB" height="270" rx="24" width="564" x="18" y="30"></rect>
<rect fill="#E1F3FA" height="103" rx="18" width="520" x="40" y="47"></rect>
<rect fill="#EAF5DF" height="103" rx="18" width="520" x="40" y="178"></rect>
<g fill="none" stroke="#007CA8" stroke-linecap="round" stroke-width="9">
<path d="M70 98H530"></path>
<path d="M70 230H530"></path>
</g>
<g class="traveller" style="transform-origin:70px 98px"><circle cx="70" cy="98" fill="#002C4E" r="21"></circle><circle cx="70" cy="98" fill="#FFFFFF" r="8"></circle></g>
<g class="traveller" style="transform-origin:70px 230px"><circle cx="70" cy="230" fill="#002C4E" r="21"></circle><circle cx="70" cy="230" fill="#FFFFFF" r="8"></circle></g>
<!-- Both paths have barriers, but not the same number. -->
<g class="path-barrier b1"><rect fill="#46809A" height="54" rx="6" width="31" x="277" y="71"></rect><path d="M285 82L300 113" opacity=".75" stroke="#FFFFFF" stroke-width="4"></path></g>
<g class="path-barrier b1"><rect fill="#46809A" height="52" rx="6" width="31" x="176" y="204"></rect><path d="M184 215L199 246" opacity=".75" stroke="#FFFFFF" stroke-width="4"></path></g>
<g class="path-barrier b2"><rect fill="#46809A" height="52" rx="6" width="31" x="305" y="204"></rect><path d="M313 215L328 246" opacity=".75" stroke="#FFFFFF" stroke-width="4"></path></g>
<g class="path-barrier b3"><rect fill="#46809A" height="52" rx="6" width="31" x="435" y="204"></rect><path d="M443 215L458 246" opacity=".75" stroke="#FFFFFF" stroke-width="4"></path></g>
<!-- Both routes share a destination; the differing barriers are the point. -->
<g class="path-compare" fill="none" opacity=".75" stroke="#007CA8" stroke-dasharray="5 6" stroke-width="2.8" style="transform-origin:300px 164px">
<rect height="83" rx="12" width="66" x="260" y="57"></rect>
<rect height="77" rx="12" width="327" x="158" y="192"></rect>
</g>
<!-- Shared destination. -->
<g fill="#78BF26" stroke="#426B17" stroke-width="2">
<path d="M532 72V126 M532 73H570L558 88L570 103H532" stroke-linejoin="round"></path>
<path d="M532 204V257 M532 204H570L558 219L570 234H532" stroke-linejoin="round"></path>
</g>
</svg>
    </div>
    <div class="action-area">
      <button id="motion-button" class="action" type="button" aria-controls="motion-visual">See it in motion</button>
    </div>
  </div>
  <span id="motion-status" class="sr-only" role="status" aria-live="polite"></span>
</main>
<script>

(function(){
  'use strict';
  const button=document.getElementById('motion-button');
  const visual=document.getElementById('motion-visual');
  const status=document.getElementById('motion-status');
  button.addEventListener('click',function(){
    visual.classList.remove('playing');
    void visual.offsetWidth; // Allow the same button to restart the CSS animation.
    visual.classList.add('playing');
    button.textContent='Replay animation';
    status.textContent='Animation started';
  });
}());

</script>
</body>
</html>
